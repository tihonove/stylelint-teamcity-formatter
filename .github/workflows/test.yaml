name: Test

on:
    push:
        branches: [master]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                stylelint: [14, 15, 16]

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 20.x
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x

            - name: Install root dependencies
              run: npm install

            - name: Build formatter (index.js / index.cjs)
              run: npm run build

            - name: Install stylelint ${{ matrix.stylelint }}
              run: npm install
              working-directory: test/versions/stylelint-${{ matrix.stylelint }}

            - name: Run tests
              run: node --test test/formatter.test.mjs
